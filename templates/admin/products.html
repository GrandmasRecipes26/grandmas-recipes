<!DOCTYPE html>
<html>

<head>

<title>Products</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/admin.css') }}">

</head>

<body>

<div class="admin-navbar">

<h2>Products</h2>

<a href="/admin/dashboard">
Dashboard
</a>

</div>

<div class="admin-container">

<table class="orders-table">

<tr>

<th>ID</th>
<th>Image</th>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Stock</th>
<th>Status</th>
<th>Update Stock</th>

</tr>

{% for product in products %}

<tr>

<td>{{ product[0] }}</td>

<td>

<img
src="{{ url_for('static',
filename='images/' + product[3]) }}"
class="product-img"
width="80">

</td>

<td>{{ product[1] }}</td>

<td>{{ product[4] }}</td>

<td>

₹{{ product[5] }}

</td>

<td>

{{ product[6] }}

</td>

<td>

{% if product[6] > 0 %}

<span
style="color:green;font-weight:bold;">

✅ In Stock

</span>

{% else %}

<span
style="color:red;font-weight:bold;">

❌ Out Of Stock

</span>

{% endif %}

</td>

<td>

<form
action="/admin/update_stock/{{ product[0] }}"
method="POST">

<input
type="number"
name="stock"
value="{{ product[6] }}"
min="0"
required>

<button type="submit">

Update

</button>

</form>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
